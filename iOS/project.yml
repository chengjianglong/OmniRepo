name: OmniRepo
options:
  bundleIdPrefix: com.chengjianglong
  deploymentTarget:
    iOS: "17.0"
packages:
  OmniRepoCore:
    path: ..
  MLXSwiftLM:
    url: https://github.com/ml-explore/mlx-swift-lm
    exactVersion: 3.33.0
  SwiftHuggingFace:
    url: https://github.com/huggingface/swift-huggingface
    from: 0.13.0
  SwiftTransformers:
    url: https://github.com/huggingface/swift-transformers
    from: 1.3.5
targets:
  OmniRepoMobile:
    type: application
    platform: iOS
    sources:
      - path: OmniRepo
      - path: ../Sources/OmniRepo/Workspace.swift
      - path: ../Sources/OmniRepo/MarkdownView.swift
      - path: ../Sources/OmniRepo/MarkdownWebView.swift
      - path: ../Sources/OmniRepo/DisplaySettings.swift
      - path: ../Sources/OmniRepo/DiscoverModel.swift
      - path: ../Sources/OmniRepo/AskChat.swift
      - path: ../Resources/mermaid.min.js
        buildPhase: resources
    dependencies:
      - package: OmniRepoCore
        product: RepoCore
      - package: MLXSwiftLM
        product: MLXLLM
      - package: MLXSwiftLM
        product: MLXLMCommon
      - package: SwiftHuggingFace
        product: HuggingFace
      - package: SwiftTransformers
        product: Tokenizers
    info:
      path: OmniRepo/Info.plist
      properties:
        CFBundleDisplayName: OmniRepo
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSLocalNetworkUsageDescription: OmniRepo connects to your Mac to run Ollama and your Claude and ChatGPT subscriptions.
        NSBonjourServices: [_omnirepo._tcp]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chengjianglong.omnirepo
        PRODUCT_NAME: OmniRepo
        DEVELOPMENT_TEAM: 228JYK7A2M
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "6.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_USER_SCRIPT_SANDBOXING: YES
